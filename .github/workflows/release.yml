name: Release

# A pushed tag v* installs the pinned toolchain and cnc-ddraw, builds the plugin, runs
# hooktest, stages the player zip and attaches it to the GitHub release for that tag.
# Built binaries never enter the repo (AGENTS.md "Hard rules"); a release is not the repo.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pinned toolchain and cnc-ddraw
        shell: pwsh
        run: ./setup-onetime.ps1

      - name: Build and run hooktest
        shell: pwsh
        run: ./build.ps1 -Test

      - name: Stage the player zip
        shell: pwsh
        run: ./tools/package-release.ps1 -Version $env:GITHUB_REF_NAME

      - name: Attach the zip to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = (Get-ChildItem work/scratch/release/*.zip).FullName
          gh release create $env:GITHUB_REF_NAME $zip --generate-notes || gh release upload $env:GITHUB_REF_NAME $zip --clobber
