; Task 075 (issue #114) -- cnc-ddraw config for the DEPLOYED normal (non-wide) launcher
; only. Installed via run-with-plugin.ps1 -Windowed -WindowedHelperDll <cnc-ddraw ddraw.dll>
; -WindowedHelperIni <this file>. NEVER read by a probe, a suite, or run-offscreen.ps1 --
; those all still get tools/plugin/cnc-ddraw.ini (065's file, untouched by this task) via
; -WindowedHelperIni's default. That split exists because this file's settings would break
; drive-game.ps1's posted-click math (see below); keeping them in two files means editing
; this one can never regress an offscreen suite by construction, not by care.
;
; Same pinned build as cnc-ddraw.ini (v7.1.0.0, provenance: tools/plugin/fetch-cnc-ddraw.ps1),
; same [StarCraft] override carried from its upstream sample ini. Keys that differ from
; cnc-ddraw.ini, and why:
;
;   width=1280 height=960   2x the 640x480 client the non-wide game requests (measured,
;                           research/renderer-viewport.md 14.2, "ddraw ws0 (cnc-ddraw):
;                           640x480 / 640x480 / FOLLOW") -- issue #114's "scale it up twice".
;   adjmouse=true           upstream's own default, OFF in cnc-ddraw.ini only because
;                           drive-game.ps1 posts client-area coordinates and needs 1:1 --
;                           this file is never posted to, only played by a real human, and
;                           adjmouse is what upstream documents for exactly this case
;                           ("Only works if stretching is enabled").
;   devmode=false           explicit, not relied on as the binary default: enables the
;                           cursor lock (ClipCursor) this file exists to bring back.
;                           Live-measured (task 075): GetClipCursor equals the window's
;                           client rect in screen coordinates AFTER the first click
;                           inside the window -- cnc-ddraw's own mouse_lock() (src/
;                           wndproc.c, pinned tag) only auto-engages on activation for
;                           real/borderless fullscreen; for a plain window like this one
;                           the unconditional trigger is a button-up click inside it
;                           ("button up messages reactivate cursor lock", src/wndproc.c).
;                           So: launch, click once anywhere in the game, cursor is
;                           confined from then on. devmode=true disables this outright.
;
; TOGGLE (issue #114 "toggleable is fine -- state what the toggle is"):
;   - Mouse lock, per-session: hold Ctrl or Right Alt (cnc-ddraw's own
;     keyunlockcursor1/2 hotkeys, unmodified from the pinned sample ini) to free the
;     cursor without editing anything; release to relock (click again if it does not
;     reacquire immediately -- see devmode=false above).
;   - Mouse lock, persistent: set devmode=true below, redeploy.
;   - 2x scale, persistent: set width=0 height=0 below (falls back to the game's
;     requested surface, i.e. back to 1x), redeploy.
;
; renderer=gdi and savesettings=0 carried over unchanged from cnc-ddraw.ini -- see that
; file's header comment for why (works with no GPU context; the shared ddraw.ini this
; becomes must stay deterministic between launches).

[ddraw]
windowed=true
fullscreen=false
width=1280
height=960
renderer=gdi
adjmouse=true
devmode=false
savesettings=0

[StarCraft]
game_handles_close=true
