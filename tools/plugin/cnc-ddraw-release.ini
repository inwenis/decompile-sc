; cnc-ddraw config shipped in the player zip (Launch-StarCraft-Modded.cmd copies it into
; game\ as ddraw.ini). Same pinned build as cnc-ddraw.ini (v7.1.0.0, provenance in
; tools/plugin/fetch-cnc-ddraw.ps1). Borderless full screen with the aspect ratio kept,
; because the monitor that plays is never the one that packaged: it fits every screen.
; cnc-ddraw ignores width/height under fullscreen=true. adjmouse=true scales the cursor
; with the frame; devmode=false keeps the cursor lock (Ctrl+Tab or Right Alt+Right Ctrl frees it).
; renderer=gdi needs no GPU context; savesettings=0 keeps this file deterministic.
; The dev launchers keep their own inis: cnc-ddraw.ini (suites, 1:1) and cnc-ddraw-2x.ini.

[ddraw]
windowed=true
fullscreen=true
maintas=true
width=0
height=0
renderer=gdi
adjmouse=true
devmode=false
savesettings=0

[StarCraft]
game_handles_close=true
