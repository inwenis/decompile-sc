; Task 065 -- cnc-ddraw config this repo installs beside the DLL when
; run-with-plugin.ps1 -Windowed -WindowedHelperDll <cnc-ddraw ddraw.dll> is used.
; This file is OURS (hand-written, not the upstream sample); it is committed, the
; DLL never is (hard rule 1). Every key here is deliberate:
;
;   windowed=true      a plain window; the user's display mode is never touched
;   fullscreen=false   belt+braces: never borderless-fullscreen either
;   width/height=0     window client = exactly the surface the game requested,
;                      so probe-widescreen-present.ps1's FOLLOW test (client
;                      width >= 800) measures the helper, not a stretch
;   renderer=gdi       no GPU swapchain: works on the invisible test desktop
;                      (task 043) where an OpenGL/D3D9 context may not
;   adjmouse=false     no mouse scaling -- drive-game.ps1 posts client-area
;                      coordinates and expects them 1:1
;   savesettings=0     cnc-ddraw must not rewrite this file on exit; the shared
;                      game dir stays deterministic between runs
;
; Task 070 tried hook=1 and noactivateapp=true here while chasing what turned
; out to be an activation-gated INPUT path (the game's glue screens ignore
; posted clicks until the window has been told it is active, which on an
; invisible desktop never happens by itself). Neither key changed anything --
; the fix is the harness posting activation before input (drive-game.ps1,
; %SCDRIVE_POST_ACTIVATE%) -- so this file stays at 065's measured config.
;
; [StarCraft] override carried from the upstream sample ini (v7.1.0.0).

[ddraw]
windowed=true
fullscreen=false
width=0
height=0
renderer=gdi
adjmouse=false
savesettings=0

[StarCraft]
game_handles_close=true
